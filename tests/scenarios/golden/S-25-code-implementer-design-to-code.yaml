user_prompt: |
  Implement Phase 1 from this DESIGN.md stub.

  === DESIGN.md (excerpt) ===
  ## Component: Rate Limiter

  **Scope for Phase 1:** In-memory sliding window rate limiter.
  Single class, no persistence, no Redis yet.

  Interface:
  ```python
  class RateLimiter:
      def __init__(self, max_requests: int, window_seconds: int): ...
      def is_allowed(self, key: str) -> bool: ...
      def reset(self, key: str) -> None: ...
  ```

  Rules:
  - `is_allowed` returns True if the key has made fewer than `max_requests`
    within the last `window_seconds`. Returns False and does NOT record the
    request if the limit is exceeded.
  - Thread-safe (use a lock).
  - `reset` clears all recorded requests for a key.

  NFRs: no external dependencies, Python 3.10+.
  Phase 2 (out of scope here): Redis-backed distributed limiter.
  ===

  Implement the RateLimiter class and its unit tests.
