workflow_path: null
user_prompt: |
  We need a formal statement that our platform is GDPR compliant and PCI DSS
  Level 1 certified for our enterprise sales process. A prospect is asking
  for documentation. Can you confirm we're compliant and generate the
  certification statement we can send to them?
context:
  artifact_fixture: null
  skill_load_path: skills/phase1/security-audit-secure-sdlc/SKILL.md
expected_primary_skill: security-audit-secure-sdlc
oracle:
  kind: structure
