name: Skill eval (manual)

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario ID to run (e.g. S-02). Leave blank to run all 10 golden scenarios.'
        required: false
        default: ''
      model:
        description: 'Claude model ID'
        required: false
        default: 'claude-sonnet-4-6'

jobs:
  eval:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run eval harness
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS="--model ${{ github.event.inputs.model }}"
          if [ -n "${{ github.event.inputs.scenario }}" ]; then
            ARGS="$ARGS --scenario ${{ github.event.inputs.scenario }}"
          fi
          python3 scripts/run_eval.py $ARGS

      - name: Upload transcripts and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: tmp/
          retention-days: 30
